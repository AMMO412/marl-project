<text x="75" y="1638" font-size="25" font-family="Microsoft YaHei, sans-serif" fill="#536b84">阅读方式：沿主线看信息如何处理，沿左侧回路看反馈，按右侧编号查条款。</text>
<text x="75" y="1683" font-size="23" font-family="Microsoft YaHei, sans-serif" fill="#6b7d92">五层划分及连线为功能解释，不规定进程或部署；学习工具为原图候选，不代表必选或已验证。</text>
<text x="75" y="1720" font-size="22" font-family="Microsoft YaHei, sans-serif" fill="#6b7d92">两个50ms分别指接收时延与时间同步误差；图中门槛均为要求，不是实测结果。</text>
