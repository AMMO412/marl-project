<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>合成街区 · 随机巡检场景</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f5f3;color:#24352d;font:14px "Microsoft YaHei",sans-serif}header{background:white;border-bottom:1px solid #dce3dc;padding:16px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}h1{font-size:20px;margin:0 14px 0 0}small{color:#6a7c70}button,select,input{font:inherit;padding:8px 11px;border:1px solid #ccd8d0;background:white;border-radius:5px}button{cursor:pointer}button.primary{background:#256553;color:white;border-color:#256553}input{width:70px}.bar{padding:10px 22px;display:flex;align-items:center;gap:15px;background:#fafcf9;flex-wrap:wrap}.bar input[type=range]{flex:1;min-width:150px}#info{color:#4d6756}#map{display:block;width:100%;height:calc(100vh - 206px);min-height:400px;background:#e9e9e1;cursor:grab}.legend{padding:10px 22px;background:white;display:flex;gap:18px;flex-wrap:wrap;color:#596c60;font-size:12px}.note{padding:7px 22px;color:#6d7c71;font-size:12px}#status{position:fixed;right:20px;bottom:70px;background:#ffffffe8;padding:9px 14px;border-radius:6px;pointer-events:none;max-width:340px;box-shadow:0 1px 6px #0002}</style>
<header><div><h1>合成街区与随机巡检</h1><small>独立场景数据 · 固定种子可复现 · 本地米制坐标</small></div><select id="scene"></select><label>任务种子 <input id="seed" type="number" min="0" value="0"></label><button id="random" class="primary">随机换一个任务区</button><button id="fit">全图</button><button id="zone">任务区</button><button id="export">导出当前任务 JSON</button></header>
<div class="bar"><span id="info"></span><button id="play">▶ 播放参考巡检</button><input id="time" type="range" min="0" value="0" step="0.1"><span id="clock"></span><select id="speed"><option value="1">1 倍</option><option value="10">10 倍</option><option value="30" selected>30 倍</option></select></div>
<canvas id="map"></canvas><div class="legend"><span>▧ 建筑：真实碰撞几何</span><span>━ 主次道路</span><span>▩ 公园 / 广场</span><span>▪ 路侧障碍：真实碰撞几何</span><span style="color:#c39020">▱ 随机任务区</span><span style="color:#2563eb">● 巡检点</span><span>彩色线 / 圆点：参考路径 / 巡检车</span></div><div class="note">合成地图，非图中真实城市。预览可抽取 20 个已生成种子；命令行可指定任意种子。参考运动仅验证道路可达，不包含多车互避、动力学或既有业务算法。</div><div id="status"></div>
<script>
const catalog=__SCENES__;
const $=id=>document.getElementById(id),canvas=$('map'),ctx=canvas.getContext('2d'),colors=['#2673bc','#ce6847','#7c62b5','#248b74'];
let index=0,caseIndex=0,t=0,playing=false,last=performance.now(),camera=null,drag=null;
catalog.forEach((s,i)=>$('scene').add(new Option(s.map.label,i)));
const current=()=>catalog[index],task=()=>current().cases[caseIndex];
function setCase(seed){caseIndex=((Math.trunc(Number(seed))||0)%current().cases.length+current().cases.length)%current().cases.length;$('seed').value=task().seed;t=0;playing=false;$('play').textContent='▶ 播放参考巡检';$('time').max=task().end_s;update();draw()}
function update(){const m=current().map,c=task();$('info').textContent=`${m.bounds[2]} × ${m.bounds[3]} m · ${m.buildings.length} 栋建筑 · ${m.roads.length} 段道路 · ${m.obstacles.length} 处障碍`;$('clock').textContent=`${t.toFixed(1)} / ${c.end_s.toFixed(0)} s`;$('time').value=t;$('status').textContent=`种子 ${c.seed} · ${c.tasks.length} 个巡检点 · ${c.robots.length} 台巡检车`}
function fit(zone=false){camera=(zone?task().zone:current().map.bounds).slice();draw()}
function projection(){let [x0,y0,x1,y1]=camera||current().map.bounds;const scale=Math.min(canvas.clientWidth/(x1-x0),canvas.clientHeight/(y1-y0))*.94;return {scale,point:p=>[canvas.clientWidth/2+(p[0]-(x0+x1)/2)*scale,canvas.clientHeight/2-(p[1]-(y0+y1)/2)*scale]}}
function polyline(points,color,width,dash=[]){ctx.beginPath();points.forEach((p,i)=>{let a=projection().point(p);i?ctx.lineTo(...a):ctx.moveTo(...a)});ctx.strokeStyle=color;ctx.lineWidth=width;ctx.setLineDash(dash);ctx.stroke();ctx.setLineDash([])}
function rectangle(box,fill,stroke){const p=projection(),[x,y,w,h]=box,[px,py]=p.point([x-w/2,y+h/2]);ctx.fillStyle=fill;ctx.fillRect(px,py,w*p.scale,h*p.scale);if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=.7;ctx.strokeRect(px,py,w*p.scale,h*p.scale)}}
function robotPosition(robot){let position=robot.start;for(const r of task().reference_routes.filter(r=>r.robot_id===robot.id)){if(t<r.start_s)break;if(t>=r.arrival_s){position=r.path.at(-1);continue}let distance=(t-r.start_s)*robot.speed_mps;for(let i=1;i<r.path.length;i++){const a=r.path[i-1],b=r.path[i],d=Math.hypot(b[0]-a[0],b[1]-a[1]);if(distance<=d)return a.map((x,j)=>x+(b[j]-x)*distance/d);distance-=d}position=r.path.at(-1)}return position}
function draw(){if(!camera)camera=current().map.bounds.slice();const ratio=devicePixelRatio||1,w=canvas.clientWidth,h=canvas.clientHeight;if(canvas.width!==Math.round(w*ratio)||canvas.height!==Math.round(h*ratio)){canvas.width=Math.round(w*ratio);canvas.height=Math.round(h*ratio)}ctx.setTransform(ratio,0,0,ratio,0,0);ctx.clearRect(0,0,w,h);const m=current().map,p=projection();
ctx.fillStyle='#e9e9e1';ctx.fillRect(0,0,w,h);
for(const park of m.parks){rectangle(park.box,'#cedfc4','#b7cdb0');const b=park.box;polyline([[b[0]-b[2]/2,b[1]],[b[0]+b[2]/2,b[1]]],'#eae6d4',2)}
for(const tree of m.trees){const a=p.point(tree);ctx.beginPath();ctx.arc(...a,2.4*p.scale,0,Math.PI*2);ctx.fillStyle='#a7c59c';ctx.fill()}
ctx.lineCap='square';for(const r of m.roads){const points=[m.nodes[r.a],m.nodes[r.b]];polyline(points,'#d0d1c8',r.width_m*p.scale+2);polyline(points,'#fcfcf7',r.width_m*p.scale);if(r.width_m>=22)polyline(points,'#dfd9b6',.7,[7,7])}
ctx.lineCap='round';for(const b of m.buildings){rectangle([b.box[0]+2,b.box[1]-2,b.box[2],b.box[3]],'#00000012');rectangle(b.box,b.category==='办公'?'#c6cbd0':b.category==='商铺'?'#d8cdc1':'#d2d2c9','#aeb5ac')}
for(const b of m.obstacles)rectangle(b.box,'#91958b','#73796e');
const [x0,y0,x1,y1]=task().zone;rectangle([(x0+x1)/2,(y0+y1)/2,x1-x0,y1-y0],'#f1c55b1b');const zone=[ [x0,y0],[x1,y0],[x1,y1],[x0,y1],[x0,y0] ];polyline(zone,'#c6942d',1.7,[6,4]);
for(const r of task().reference_routes){const i=task().robots.findIndex(x=>x.id===r.robot_id);polyline(r.path,colors[i]+'77',1.6,[4,4])}
ctx.font='11px Microsoft YaHei';for(const q of task().tasks){const a=p.point(q.position);ctx.beginPath();ctx.arc(...a,4,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();ctx.strokeStyle='#286baf';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#245d94';ctx.fillText(q.id,a[0]+6,a[1]-5)}
for(const [i,r] of task().robots.entries()){const a=p.point(robotPosition(r));ctx.beginPath();ctx.arc(...a,6,0,Math.PI*2);ctx.fillStyle=colors[i];ctx.fill();ctx.strokeStyle='white';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle=colors[i];ctx.fillText('巡检车 '+(i+1),a[0]+9,a[1]+4)}
ctx.fillStyle='#47614d';ctx.fillText('北 ↑',20,24);const length=100;ctx.strokeStyle='#627363';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(20,h-18);ctx.lineTo(20+length*p.scale,h-18);ctx.stroke();ctx.fillText('100 m',20,h-26);
}
$('scene').onchange=e=>{index=Number(e.target.value);camera=null;setCase(0);fit()};$('seed').onchange=e=>setCase(e.target.value);$('random').onclick=()=>{let k=(caseIndex+1+Math.floor(Math.random()*(current().cases.length-1)))%current().cases.length;setCase(k);fit(true)};$('fit').onclick=()=>fit();$('zone').onclick=()=>fit(true);$('play').onclick=()=>{if(t>=task().end_s)t=0;playing=!playing;$('play').textContent=playing?'Ⅱ 暂停':'▶ 播放参考巡检';last=performance.now()};$('time').oninput=e=>{t=Number(e.target.value);playing=false;$('play').textContent='▶ 播放参考巡检';update();draw()};$('export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(task(),null,2)],{type:'application/json'}));a.download=current().map.id+'_seed_'+task().seed+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
canvas.onwheel=e=>{e.preventDefault();const factor=e.deltaY>0?1.2:1/1.2,[x0,y0,x1,y1]=camera,cx=(x0+x1)/2,cy=(y0+y1)/2,dx=(x1-x0)*factor/2,dy=(y1-y0)*factor/2;camera=[cx-dx,cy-dy,cx+dx,cy+dy];draw()};canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY,camera.slice()];canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!drag)return;const scale=projection().scale,dx=(e.clientX-drag[0])/scale,dy=(e.clientY-drag[1])/scale;camera=[drag[2][0]-dx,drag[2][1]+dy,drag[2][2]-dx,drag[2][3]+dy];draw()};canvas.onpointerup=()=>drag=null;window.onresize=draw;
function tick(now){const dt=Math.min(.1,(now-last)/1000);last=now;if(playing){t=Math.min(task().end_s,t+dt*Number($('speed').value));if(t>=task().end_s){playing=false;$('play').textContent='▶ 播放参考巡检'}update();draw()}requestAnimationFrame(tick)}
window.ScenePreview={state:()=>({map:current().map.id,seed:task().seed,time:t,playing}),select:(i,s=0)=>{index=i;camera=null;$('scene').value=i;setCase(s);fit()},setTime:x=>{t=x;update();draw()}};
const query=new URLSearchParams(location.search);const requested=catalog.findIndex(s=>s.map.id===query.get('map'));if(requested>=0)index=requested;$('scene').value=index;
setCase(Number(query.get('seed'))||0);fit(query.get('zone')==='1');requestAnimationFrame(tick);
</script></html>
